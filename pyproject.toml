[project]
name = "aaaav"
version = "0.4.0"
description = "Streamlined AAAAV agent workflow plugin for Antigravity, Claude Code, and Codex"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Wei Hung" }
]
license = { text = "MIT" }
keywords = ["aaaav", "agent-workflow", "streamlined-skills", "antigravity", "claude-code", "codex"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
