[project]
name = "anchorloop"
version = "2.3.0"
description = "Validators and tests for the Anchorloop pi package"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Wei Hung" }
]
license = { text = "MIT" }
keywords = ["anchorloop", "agent-workflow", "streamlined-skills", "pi-package"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
